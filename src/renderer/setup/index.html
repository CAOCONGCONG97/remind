<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>首次设置</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="mark" aria-hidden="true">
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <h1>设置紧急密码</h1>
        <p class="hint">
          用于跳过休息或取消关机。首次必须设置，完成后才会开始计时。
        </p>
        <form id="form">
          <div class="field">
            <label for="password">紧急密码</label>
            <input id="password" type="password" autocomplete="new-password" required autofocus placeholder="请输入密码" />
          </div>
          <div class="field">
            <label for="passwordConfirm">确认密码</label>
            <input id="passwordConfirm" type="password" autocomplete="new-password" required placeholder="再输入一次" />
          </div>
          <p id="error" class="error"></p>
          <button type="submit" class="primary">开始使用</button>
        </form>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
