<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>即将关机</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="toast">
      <h1>即将关机</h1>
      <p id="summary" class="summary">计划关机时刻 --:--</p>
      <p id="remain" class="remain">剩余 --:--</p>
      <div id="mainActions" class="actions">
        <button id="cancelBtn" class="danger">取消关机</button>
        <button id="ackBtn" class="ghost">知道了</button>
      </div>
      <form id="cancelForm" hidden>
        <label for="password">紧急密码</label>
        <input id="password" type="password" autocomplete="current-password" />
        <p class="hint">请选择取消范围</p>
        <div class="actions">
          <button type="submit" data-scope="once" class="primary">仅本次</button>
          <button type="submit" data-scope="today" class="primary">当天</button>
        </div>
        <button type="button" id="backBtn" class="ghost wide">返回</button>
        <p id="error" class="error"></p>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
